<!DOCTYPE html>
<html lang="en">
<head>
    <link href="css.css" rel="stylesheet" >
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

<h1 style="color: red">КРОВАВАЯ БИТВА!</h1>

<div class="container">
    <div class="vibor-person">
        <h2>Выберите персонажа для кровавой битвы!</h2>
        <button class="rogue">Разбойник</button>
        <button class="warrior">Воин</button>
        <button class="barbarian">Варвар</button>
    </div>

    <div class="battle-console">
        <h4>Консоль боя:</h4>
        <div class="console-output"></div>
    </div>

    <div class="start-button">
        <button id="start-battle">Начать бой</button>
        <button class="new-weapon">Подобрать оружие</button>
        <div class="level-up-btn" style="display: none">
            <button class="level-up-rogue">Выбрать Разбойника</button>
            <button class="level-up-warrior">Выбрать Воина</button>
            <button class="level-up-barbarian">Выбрать Варвара</button>
        </div>
    </div>
</div>



<script src="js15.js"></script>

</html>
